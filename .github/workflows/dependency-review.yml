name: Dependency Review

# Blocks a pull request that adds a dependency with a known high or critical vulnerability.
# Needs the repository's dependency graph (Settings > Advanced Security). See
# docs/continuous-integration.md. Covers the manifests GitHub parses (requirements.txt,
# pyproject.toml) and GitHub Actions references.
on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
