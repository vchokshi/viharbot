name: CI

# Validates every pull request and every push to main. It runs offline: no secrets, no live
# model calls, no deployment. See docs/continuous-integration.md.
# The Docker job runs on pull requests only when a container definition changes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale pull request runs. Never cancel a run on main: its result feeds the badges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The UI tests run the page's real script in Node; without it they skip instead of run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests with coverage
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -ra -q \
            --junitxml=reports/test-results.xml \
            --cov --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Python ${{ matrix.python-version }}"
            echo "| Check | Result | Evidence |"
            echo "|---|---|---|"
            if [ -f reports/test-results.xml ]; then
              python .github/scripts/junit_summary.py reports/test-results.xml --name "Python tests" || true
            else
              echo "| Python tests | no result produced | see the job log |"
            fi
            if [ -f reports/coverage.xml ]; then
              python .github/scripts/coverage_summary.py reports/coverage.xml
            else
              echo "| Coverage | no report produced | see the job log |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viharbot-test-results-py${{ matrix.python-version }}
          path: reports/test-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage (XML)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viharbot-coverage-xml-py${{ matrix.python-version }}
          path: reports/coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage (HTML)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viharbot-coverage-html-py${{ matrix.python-version }}
          path: reports/htmlcov
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: Frontend tests (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      # The page has no npm dependencies and no package.json. Its tests are pytest modules that run
      # the page's own script in Node against a small fake DOM (tests/js).
      - name: Run frontend tests
        shell: bash
        run: |
          mkdir -p reports
          node --version
          python -m pytest -ra -q \
            tests/test_ui_live.py tests/test_ui_orchestration.py \
            tests/test_team_page.py tests/test_team_status_consistency.py \
            --junitxml=reports/frontend-results.xml
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Frontend tests"
            echo "| Check | Result | Evidence |"
            echo "|---|---|---|"
            if [ -f reports/frontend-results.xml ]; then
              python .github/scripts/junit_summary.py reports/frontend-results.xml --name "JavaScript tests (Node $(node --version))" || true
            else
              echo "| JavaScript tests | no result produced | see the job log |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # A skipped test means Node did not really run the page, so treat skips as a failure here.
      - name: Require that no frontend test was skipped
        run: python .github/scripts/junit_summary.py reports/frontend-results.xml --name "Frontend" --fail-on-skipped
      - name: Upload frontend results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viharbot-frontend-results
          path: reports/frontend-results.xml
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Ruff's default rules change between releases, so the version is pinned.
      - name: Install Ruff
        run: python -m pip install "ruff==0.17.3"
      - name: Ruff (blocking rules from pyproject.toml)
        run: ruff check src tests scripts .github/scripts
      - name: Ruff (advisory report, non-blocking)
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          ruff check src tests scripts .github/scripts --select E4,E7,E9,F --exit-zero \
            --output-format concise > reports/ruff-advisory.txt || true
          ruff check src tests scripts .github/scripts --select E4,E7,E9,F --exit-zero \
            --statistics > reports/ruff-advisory-statistics.txt || true
      - name: Job summary
        if: always()
        shell: bash
        run: |
          findings=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+:' reports/ruff-advisory.txt || true)
          {
            echo "### Lint"
            echo "| Check | Result | Evidence |"
            echo "|---|---|---|"
            echo "| Ruff blocking rules (E9, F63, F7, F82) | ${{ job.status }} | job log |"
            echo "| Ruff advisory (E4, E7, E9, F) | ${findings} finding(s), not blocking | viharbot-lint-report |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viharbot-lint-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # Decides whether the Docker job is needed. The job below is skipped, not removed, when it is
  # not, so the "CI result" gate always runs and can stay a required check. See "CI result".
  changes:
    name: Detect container changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as a merge commit; depth 2 includes both its parents.
          fetch-depth: 2
      - name: Did a container definition change?
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # What counts as a container definition: what builds or starts the images. Application
          # source is deliberately not listed; it is covered by the test jobs, and every push to
          # main still builds the images.
          pattern='^(Dockerfile(\.[^/]+)?|compose\.yaml|\.dockerignore|requirements\.txt|pyproject\.toml|certs/.*|\.github/workflows/ci\.yml)$'
          run_docker() { echo "docker=true" >> "$GITHUB_OUTPUT"; echo "Docker job will run: $1"; exit 0; }
          [ "$EVENT_NAME" = "pull_request" ] || run_docker "this is not a pull request"
          # The first parent of the merge commit is the base branch, so this is the PR's own change.
          files="$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null)" \
            || run_docker "the changed files could not be determined"
          [ -n "$files" ] || run_docker "no changed files were found"
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "Changed container definitions:"; printf '%s\n' "$files" | grep -E "$pattern"
            run_docker "a container definition changed"
          fi
          echo "docker=false" >> "$GITHUB_OUTPUT"
          echo "Docker job skipped: no container definition changed."

  docker:
    name: Docker build and smoke test
    needs: [changes]
    # Always on pushes to main and manual runs; on pull requests only for container changes.
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate the Compose file
        run: docker compose config --quiet
      # Builds every image the repository defines, including the demo and tests profiles.
      # Nothing is pushed to a registry.
      - name: Build all images
        shell: bash
        run: |
          mkdir -p reports
          docker compose --profile demo --profile tests build --progress=plain 2>&1 | tee reports/docker-build.log
      # Starts the stack with no LiteLLM key and no optional modes, then checks only things that
      # need no model: health, the page, and the stream route's refusal when iterative mode is off.
      - name: Start the stack and check health
        shell: bash
        run: |
          docker compose up -d --wait --wait-timeout 240
          docker compose ps --format 'table {{.Service}}\t{{.Status}}' | tee reports/compose-ps.txt
          curl -fsS http://127.0.0.1:8080/health | tee reports/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/chat/stream -H 'content-type: application/json' -d '{"message":"hi"}')" = "409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/chat/stream -H 'content-type: application/json' -d '{}')" = "422"
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Docker"
            echo "| Check | Result | Evidence |"
            echo "|---|---|---|"
            echo "| Build all images (web, 5 agents, orchestrator, tests) | ${{ job.status }} | viharbot-docker-build-log |"
            echo "| Stack health, page, stream route (409 and 422) | ${{ job.status }} | viharbot-docker-build-log |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viharbot-docker-build-log
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # One required check for branch protection, and one consolidated summary.
  ci:
    name: CI result
    if: always()
    needs: [python-tests, frontend-tests, lint, changes, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize and gate
        shell: bash
        run: |
          {
            echo "## CI result"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Python tests (3.12, 3.13) | ${{ needs.python-tests.result }} |"
            echo "| Frontend tests (Node 24) | ${{ needs.frontend-tests.result }} |"
            echo "| Lint (Ruff) | ${{ needs.lint.result }} |"
            if [ "${{ needs.docker.result }}" = "skipped" ] && [ "${{ needs.changes.outputs.docker }}" = "false" ]; then
              echo "| Docker build and smoke test | skipped: no container definition changed |"
            else
              echo "| Docker build and smoke test | ${{ needs.docker.result }} |"
            fi
            echo
            echo "Counts, coverage and findings are in each job's own summary and in the run's artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "${{ needs.python-tests.result }}" "${{ needs.frontend-tests.result }}" "${{ needs.lint.result }}" "${{ needs.changes.result }}"; do
            if [ "$result" != "success" ]; then echo "A required job did not succeed: $result"; exit 1; fi
          done
          # Docker may be skipped only if the detection job ran and said no container changed.
          # A failed or missing detection job already failed the gate above.
          docker_result="${{ needs.docker.result }}"
          if [ "${{ needs.changes.outputs.docker }}" = "true" ]; then
            [ "$docker_result" = "success" ] || { echo "Docker build and smoke test did not succeed: $docker_result"; exit 1; }
          else
            [ "$docker_result" = "skipped" ] || { echo "Unexpected Docker result: $docker_result"; exit 1; }
          fi

  publish-coverage-badge:
    name: Publish coverage badge data
    # Only a successful run on main publishes. Pull requests and forks never get write access.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viharbot-coverage-xml-py3.12
          path: coverage-report
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The badge JSON is computed from this run's measured coverage.xml and written to an orphan
      # `badges` branch that holds nothing else. It is never edited by hand.
      - name: Compute and publish the badge
        shell: bash
        run: |
          python .github/scripts/coverage_summary.py coverage-report/coverage.xml --badge-json "$RUNNER_TEMP/coverage.json" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then echo "Badge data unchanged."; exit 0; fi
          git commit -m "Update coverage badge data from ${GITHUB_SHA::7}"
          git push origin badges
