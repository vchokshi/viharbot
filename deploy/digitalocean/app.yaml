name: viharbot-stage
region: nyc
domains:
  - domain: viharbot-stage.viharchokshi.com
    type: PRIMARY
    zone: viharchokshi.com

# Configure the empty SECRET values in the DigitalOcean control panel before
# sending real traffic. Do not put credential values in this repository.
envs:
  - key: LITELLM_BASE_URL
    value: https://litellm.viharchokshi.com
    scope: RUN_TIME
    type: GENERAL

# PROPOSAL, NOT APPROVED FOR DEPLOY (docs/stage-memory-deployment-plan.md). The memory pieces below
# (`memory-db`, the `memory` service, the `memory-bootstrap` job and Charlie's memory variables) are
# a proposed spec change for design item 11. The founder creates the managed cluster outside this
# spec and applies a local filled copy only after answering the promotion question for one build.
# Replace the two PLACEHOLDER_ values in the local copy, never here. Every SECRET below is empty on
# purpose: paste values in the local copy or the control panel, never commit them.
databases:
  # Binds the founder's existing cluster so its connection variables can be referenced.
  # UNVERIFIED: that `db_user: doadmin` is accepted for an attached production cluster (the probe
  # used the same form but its result for this exact shape is not recorded as a pass).
  - name: memory-db
    engine: PG
    production: true
    cluster_name: PLACEHOLDER_CLUSTER_NAME
    db_name: PLACEHOLDER_DATABASE_NAME
    db_user: doadmin

services:
  - name: web
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.web
    source_dir: /
    http_port: 8080
    health_check:
      http_path: /health
      port: 8080
    envs:
      - key: WEB_AUTH_ENABLED
        value: "true"
        scope: RUN_TIME
        type: GENERAL
      # Public image store (DigitalOcean Spaces CDN). Not a secret. The web image no longer bundles
      # images, so this must be set in the same deploy as the image change (docs/image-storage.md).
      - key: WEB_IMAGES_BASE_URL
        value: "https://viharbot-stage.sfo3.cdn.digitaloceanspaces.com/images"
        scope: RUN_TIME
        type: GENERAL
      - key: WEB_USERNAME
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: WEB_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: WEB_STATIC_DIR
        value: /app/static
        scope: RUN_TIME
        type: GENERAL
      # Slide-deck generation is off on Stage, and this spec has no pixel component.
      - key: VIHARBOT_PPT_GENERATION_ENABLED
        value: "false"
        scope: RUN_TIME
        type: GENERAL
      # Charlie's planner (the live team conversation) is the only inference the web service makes.
      # It runs only when BOTH of these are non-empty (src/viharbot/live_team.py): the alias below
      # and a key. The key is empty on purpose: the founder pastes the `stage-web` key (scoped to
      # gpt-6-luna) in the local filled copy, never here.
      - key: CHARLIE_PLANNER_MODEL
        value: gpt-6-luna
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: RESEARCH_URL
        value: http://research:8000/research
        scope: RUN_TIME
        type: GENERAL
      - key: SECURITY_URL
        value: http://security:8000/assess
        scope: RUN_TIME
        type: GENERAL
      - key: FACT_CHECK_URL
        value: http://fact-check:8000/process
        scope: RUN_TIME
        type: GENERAL
      - key: SOURCE_QUALITY_URL
        value: http://source-quality:8000/process
        scope: RUN_TIME
        type: GENERAL
      - key: PRIVACY_REVIEW_URL
        value: http://privacy-review:8000/process
        scope: RUN_TIME
        type: GENERAL
      - key: SYNTHESIS_URL
        value: http://synthesis:8000/process
        scope: RUN_TIME
        type: GENERAL

  - name: research
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.research
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: RESEARCH_MODEL
        value: gpt-6.1-sol
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: security
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.security
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: SECURITY_MODEL
        value: openai/gpt-5.4
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: fact-check
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: fact-check
        scope: RUN_TIME
        type: GENERAL
      - key: FACT_CHECK_MODEL
        value: gemini/gemini-3.5-flash
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: source-quality
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: source-quality
        scope: RUN_TIME
        type: GENERAL
      - key: SOURCE_QUALITY_MODEL
        value: gemini/gemini-3.5-flash
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: privacy-review
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: privacy-review
        scope: RUN_TIME
        type: GENERAL
      - key: PRIVACY_MODEL
        value: openai/gpt-5.4-mini
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: synthesis
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: synthesis
        scope: RUN_TIME
        type: GENERAL
      - key: SYNTHESIS_MODEL
        value: openai/gpt-5.4-mini
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      # Governed memory (docs/stage-memory-design.md 2.3). Memory is ON whenever VIHARBOT_MEMORY_URL is
      # set; remove it (and redeploy) to turn memory off. Charlie only; no other component has these.
      - key: VIHARBOT_MEMORY_URL
        value: https://memory:8443
        scope: RUN_TIME
        type: GENERAL
      # The memory service's certificate (the same base64 file as MEMORY_TLS_CERT_PEM): Charlie's
      # ONLY trusted certificate.
      - key: VIHARBOT_MEMORY_CA_PEM
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: VIHARBOT_OUTBOUND_AUTH
        value: "on"
        scope: RUN_TIME
        type: GENERAL
      # Must match the key id in the memory registry (printed by scripts/stage_memory_materials.py).
      - key: VIHARBOT_SIGNING_KID
        value: charlie-stage-1
        scope: RUN_TIME
        type: GENERAL
      - key: VIHARBOT_SERVICE_SUBJECT
        value: charlie
        scope: RUN_TIME
        type: GENERAL
      - key: VIHARBOT_SIGNING_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  # Governed memory service (design 2.4). INTERNAL ONLY: no http_port and no public route. It
  # serves HTTPS itself on 8443, so the platform check is a TCP check.
  - name: memory
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.memory
    source_dir: /
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1  # one instance: the replay cache is per process
    internal_ports:
      - 8443
    health_check:
      port: 8443
    envs:
      - key: MEMORY_STAGE_ROLE
        value: serve
        scope: RUN_TIME
        type: GENERAL
      # The image sets PORT=8000; the launcher only defaults to 8443 when PORT is unset.
      - key: PORT
        value: "8443"
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_TLS_CERT_PEM
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: MEMORY_TLS_KEY_PEM
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: VIHARBOT_KEY_REGISTRY_B64
        value: ""
        scope: RUN_TIME
        type: SECRET
      # Binding references (not secrets). HOSTNAME and PORT are TESTED bindable names (PR #326);
      # DATABASE is DOCUMENTED only.
      - key: MEMORY_DB_HOST
        value: ${memory-db.HOSTNAME}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DB_PORT
        value: ${memory-db.PORT}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DB_NAME
        value: ${memory-db.DATABASE}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DB_USER
        value: memory_service
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DB_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: MEMORY_DB_SSLMODE
        value: verify-full
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DB_CA_PEM
        value: ""
        scope: RUN_TIME
        type: SECRET

jobs:
  # Runs before every deployment (and again on a platform rollback, tested 2026-11-23), so every step is
  # idempotent. Its migrator CONNECT grant was validated on DigitalOcean by the probe retest 2026-11-23.
  - name: memory-bootstrap
    kind: PRE_DEPLOY
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.memory
    source_dir: /
    envs:
      - key: MEMORY_STAGE_ROLE
        value: bootstrap
        scope: RUN_TIME
        type: GENERAL
      # Admin connection from the binding. HOSTNAME, PORT and USERNAME are TESTED bindable names;
      # PASSWORD and DATABASE are DOCUMENTED only (design 2.3, PR #326 row 4d).
      - key: MEMORY_ADMIN_DB_HOST
        value: ${memory-db.HOSTNAME}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_ADMIN_DB_PORT
        value: ${memory-db.PORT}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_ADMIN_DB_USER
        value: ${memory-db.USERNAME}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_ADMIN_DB_PASSWORD
        value: ${memory-db.PASSWORD}
        scope: RUN_TIME
        type: SECRET
      - key: MEMORY_ADMIN_DB_NAME
        value: ${memory-db.DATABASE}
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_ADMIN_DB_SSLMODE
        value: verify-full
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DB_MIGRATOR_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
      # Same value as MEMORY_DB_PASSWORD on the memory service.
      - key: MEMORY_DB_SERVICE_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: MEMORY_DB_CA_PEM
        value: ""
        scope: RUN_TIME
        type: SECRET
