name: viharbot-stage
region: nyc
domains:
  - domain: viharbot-stage.viharchokshi.com
    type: PRIMARY
    zone: viharchokshi.com

# Configure the empty SECRET values in the DigitalOcean control panel before
# sending real traffic. Do not put credential values in this repository.
envs:
  - key: LITELLM_BASE_URL
    value: https://litellm.viharchokshi.com
    scope: RUN_TIME
    type: GENERAL

services:
  - name: web
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.web
    source_dir: /
    http_port: 8080
    health_check:
      http_path: /health
      port: 8080
    envs:
      - key: WEB_AUTH_ENABLED
        value: "true"
        scope: RUN_TIME
        type: GENERAL
      - key: WEB_USERNAME
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: WEB_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: WEB_STATIC_DIR
        value: /app/static
        scope: RUN_TIME
        type: GENERAL
      - key: RESEARCH_URL
        value: http://research:8000/research
        scope: RUN_TIME
        type: GENERAL
      - key: SECURITY_URL
        value: http://security:8000/assess
        scope: RUN_TIME
        type: GENERAL
      - key: FACT_CHECK_URL
        value: http://fact-check:8000/process
        scope: RUN_TIME
        type: GENERAL
      - key: SOURCE_QUALITY_URL
        value: http://source-quality:8000/process
        scope: RUN_TIME
        type: GENERAL
      - key: PRIVACY_REVIEW_URL
        value: http://privacy-review:8000/process
        scope: RUN_TIME
        type: GENERAL
      - key: SYNTHESIS_URL
        value: http://synthesis:8000/process
        scope: RUN_TIME
        type: GENERAL

  - name: research
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.research
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: RESEARCH_MODEL
        value: openai/gpt-5.4-mini
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: security
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.security
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: SECURITY_MODEL
        value: openai/gpt-5.4
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: fact-check
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: fact-check
        scope: RUN_TIME
        type: GENERAL
      - key: FACT_CHECK_MODEL
        value: gemini/gemini-3.5-flash
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: source-quality
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: source-quality
        scope: RUN_TIME
        type: GENERAL
      - key: SOURCE_QUALITY_MODEL
        value: gemini/gemini-3.5-flash
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: privacy-review
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: privacy-review
        scope: RUN_TIME
        type: GENERAL
      - key: PRIVACY_MODEL
        value: openai/gpt-5.4-mini
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET

  - name: synthesis
    github:
      repo: vchokshi/viharbot
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile.specialist
    source_dir: /
    internal_ports:
      - 8000
    health_check:
      http_path: /health
      port: 8000
    envs:
      - key: AGENT_KIND
        value: synthesis
        scope: RUN_TIME
        type: GENERAL
      - key: SYNTHESIS_MODEL
        value: openai/gpt-5.4-mini
        scope: RUN_TIME
        type: GENERAL
      - key: MEMORY_DIR
        value: /tmp/viharbot-memory
        scope: RUN_TIME
        type: GENERAL
      - key: LITELLM_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
