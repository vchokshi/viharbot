# THROWAWAY second app for the DigitalOcean probe (deploy/digitalocean-probe/RUNBOOK.md, fact 4).
# One worker, no public route, no database binding. It tries to reach the FIRST app's internal
# service by every candidate hostname and public URL and logs one JSON line per run.
#
# Fill the two GENERAL values after the first app's results are read (RUNBOOK step 8); they are
# names and URLs, not secrets. All claims about App Platform behaviour are UNVERIFIED until run.
name: viharbot-probe-outsider
region: nyc   # same region as the first app: the harder isolation case

workers:
  - name: probe-outsider
    github:
      repo: vchokshi/viharbot
      branch: feature/stage-probe-retest
      deploy_on_push: false
    dockerfile_path: deploy/digitalocean-probe/Dockerfile.probe
    source_dir: /
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: PROBE_ROLE
        value: outsider
        scope: RUN_TIME
        type: GENERAL
      # Hostnames and private IPs of probe-service to try, host or host:port, comma-separated.
      # Start with the plain name, then add the forms and addresses the client reported.
      - key: PROBE_TARGET_HOSTS
        value: "probe-service,probe-service:8443"
        scope: RUN_TIME
        type: GENERAL
      - key: PROBE_TARGET_PORT
        value: "8443"
        scope: RUN_TIME
        type: GENERAL
      # The first app's public URL(s), for example the live URL shown in the control panel.
      - key: PROBE_PUBLIC_URLS
        value: ""
        scope: RUN_TIME
        type: GENERAL
      - key: PROBE_OUTSIDER_INTERVAL
        value: "600"
        scope: RUN_TIME
        type: GENERAL
      # Retest R1 (RUNBOOK section 8b): the database denial check. Leave the secrets empty to skip
      # it. This app has no database binding and is never a trusted source of the cluster. Use a
      # throwaway database user, not a real credential; paste the values in the control panel.
      # For the retest set PROBE_OUTSIDER_INTERVAL to "60" in your copy so the log shows the change
      # when the trusted-source rule is added.
      - key: PROBE_OUTSIDER_DB_HOST
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PROBE_OUTSIDER_DB_USER
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PROBE_OUTSIDER_DB_PASSWORD
        value: ""
        scope: RUN_TIME
        type: SECRET
      # Optional: the cluster CA (public). With it the login stage uses verify-full.
      - key: PROBE_OUTSIDER_DB_CA_PEM
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PROBE_OUTSIDER_DB_PORT
        value: "25060"
        scope: RUN_TIME
        type: GENERAL
      # `defaultdb`, not `probe`: the probe job revokes PUBLIC CONNECT on `probe`, which would look
      # like a refusal that the trusted-source rule did not cause.
      - key: PROBE_OUTSIDER_DB_NAME
        value: defaultdb
        scope: RUN_TIME
        type: GENERAL
