[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viharbot"
version = "2.3.0"
description = "A distributed multi-agent learning project using Strands and LiteLLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "strands-agents[litellm]>=1.0.0",
  "boto3>=1.42.0",
  # Ed25519 verification and signing for service authentication (ADR-006 A2). Already installed
  # transitively in a clean install (PyJWT[crypto], required by mcp); declared so it is explicit.
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]
# python-pptx is here as well as in the `pixel` extra so CI exercises Pixel's renderer for real.
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "httpx>=0.27.0", "python-pptx>=1.0.0", "psycopg[binary]==3.3.8"]
# PostgreSQL driver for the memory service (ADR-009, issue #40). Installed only in the memory image
# and the test image, not in the other services. LGPL-3.0-only (unmodified, installed from PyPI);
# the version is pinned exactly. See docs/memory-service.md for the license note.
memory = ["psycopg[binary]==3.3.8"]
# Standalone slide-populate utility (scripts/pptx_populate.py); not installed in any service image.
pixel = ["python-pptx>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/viharbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Blocking lint rules: syntax errors and undefined names, the mistakes that are real bugs.
# Ruff's default rule set changes between releases, so the blocking set is explicit and CI pins
# the Ruff version. CI also runs a non-blocking report of the pyflakes and pycodestyle families;
# widen this list as that report is cleaned up.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# Line coverage of the application package only. Not measured: tests, scripts, the static page's
# JavaScript (it is exercised by the Node tests but not instrumented), and the Dockerfiles.
[tool.coverage.run]
source = ["src/viharbot"]
branch = false

[tool.coverage.report]
# Measured baseline is 95%. The floor is set below it so ordinary changes do not trip it, and
# should be raised as coverage improves. See docs/continuous-integration.md.
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
