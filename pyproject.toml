[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viharbot"
version = "2.3.0"
description = "A distributed multi-agent learning project using Strands and LiteLLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "strands-agents[litellm]>=1.0.0",
  "boto3>=1.42.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/viharbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

