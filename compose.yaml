# Service authentication (ADR-006 A2, issue #235) is ON by default in local Compose only. Run
# `python scripts/dev_service_auth.py` once to generate development keys and a registry under
# data/dev-auth/ (gitignored); they are mounted at run time and never baked into an image. Set
# VIHARBOT_SERVICE_AUTH=off and VIHARBOT_OUTBOUND_AUTH=off in .env to run without it. This does not
# change deploy/digitalocean/app.yaml: Stage stays off until it is promoted deliberately.
x-auth-verify: &auth-verify
  VIHARBOT_SERVICE_AUTH: ${VIHARBOT_SERVICE_AUTH:-on}
  VIHARBOT_KEY_REGISTRY: /run/viharbot-auth/registry.toml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VIHARBOT_OUTBOUND_AUTH: ${VIHARBOT_OUTBOUND_AUTH:-on}
      VIHARBOT_SIGNING_KID: web-dev-1
      VIHARBOT_SERVICE_SUBJECT: web
      VIHARBOT_SIGNING_KEY_FILE: /run/viharbot-auth/signing.key
      PORT: 8080
      WEB_STATIC_DIR: /app/static
      # Images live in the public Spaces store, not in the repository or the image.
      WEB_IMAGES_BASE_URL: ${WEB_IMAGES_BASE_URL:-https://viharbot.sfo3.cdn.digitaloceanspaces.com/images}
      WEB_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-0}
      WEB_USERNAME: ${WEB_USERNAME:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      # Development Wiki (read-only). Empty means the wiki reports itself unavailable. Use a
      # fine-grained read-only token for this one repository; it never reaches the browser.
      DEV_WIKI_GITHUB_TOKEN: ${DEV_WIKI_GITHUB_TOKEN:-}
      RESEARCH_URL: http://research:8000/research
      SECURITY_URL: http://security:8000/assess
      FACT_CHECK_URL: http://fact-check:8000/process
      SOURCE_QUALITY_URL: http://source-quality:8000/process
      PRIVACY_REVIEW_URL: http://privacy-review:8000/process
      SYNTHESIS_URL: http://synthesis:8000/process
      PIXEL_URL: http://pixel:8000/process
      # Sage is offered to Charlie only where this is set; there is no built-in default address.
      SAGE_URL: http://sage:8000/process
      # Slide-deck generation (Pixel). True while the feature is being tested; set it to false in
      # compose and .env when the feature is done so no request spends model calls on decks.
      VIHARBOT_PPT_GENERATION_ENABLED: ${VIHARBOT_PPT_GENERATION_ENABLED:-true}
      # The live team conversation has no flag: it runs when the planner is configured, that is
      # when WEB_LITELLM_API_KEY is passed (below) with a planner alias. Without the key the web
      # service runs the fixed pipeline.
      # Dev only: planner rationale and model aliases in the live stream. Off by default.
      VIHARBOT_DEV_DIAGNOSTICS_ENABLED: ${VIHARBOT_DEV_DIAGNOSTICS_ENABLED:-false}
      # Charlie's planner is the only inference the web service makes. Its alias defaults to
      # gpt-6-luna, but it stays unavailable until the three flags are true and a key is passed
      # through the opt-in WEB_LITELLM_API_KEY, so the browser-facing container holds no key by default.
      CHARLIE_PLANNER_MODEL: ${CHARLIE_PLANNER_MODEL:-gpt-6-luna}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${WEB_LITELLM_API_KEY:-}
    volumes:
      - ./data/dev-auth/keys/web.key:/run/viharbot-auth/signing.key:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      research:
        condition: service_healthy
      security:
        condition: service_healthy
      fact-check:
        condition: service_healthy
      source-quality:
        condition: service_healthy
      privacy-review:
        condition: service_healthy
      synthesis:
        condition: service_healthy
      pixel:
        condition: service_healthy
      sage:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  research:
    build:
      context: .
      dockerfile: Dockerfile.research
    environment:
      <<: *auth-verify
      VIHARBOT_OUTBOUND_AUTH: ${VIHARBOT_OUTBOUND_AUTH:-on}
      VIHARBOT_SIGNING_KID: research-dev-1
      VIHARBOT_SERVICE_SUBJECT: research
      VIHARBOT_SIGNING_KEY_FILE: /run/viharbot-auth/signing.key
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-gpt-6.1-sol}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - ./data/dev-auth/keys/research.key:/run/viharbot-auth/signing.key:ro
      - ./data/research:/data/research
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  security:
    build:
      context: .
      dockerfile: Dockerfile.security
    environment:
      <<: *auth-verify
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      SECURITY_MODEL: ${SECURITY_MODEL:-openai/gpt-5.4}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - ./data/security:/data/security
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  fact-check:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      <<: *auth-verify
      AGENT_KIND: fact-check
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      FACT_CHECK_MODEL: ${FACT_CHECK_MODEL:-gemini/gemini-3.5-flash}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - fact_check_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  source-quality:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      <<: *auth-verify
      AGENT_KIND: source-quality
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      SOURCE_QUALITY_MODEL: ${SOURCE_QUALITY_MODEL:-gemini/gemini-3.5-flash}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - source_quality_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  privacy-review:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      <<: *auth-verify
      AGENT_KIND: privacy-review
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      PRIVACY_MODEL: ${PRIVACY_MODEL:-openai/gpt-5.4-mini}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - privacy_review_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  synthesis:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      <<: *auth-verify
      AGENT_KIND: synthesis
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-openai/gpt-5.4-mini}
      MEMORY_DIR: /data
      # Governed memory (ADR-009, issue #40 PR 2): Charlie only, on in local Compose because a URL
      # is set (there is no flag; with no URL, as on Stage, memory is inactive). Best effort: this
      # service does NOT depend on `memory` to start, and answers without it if it is unavailable.
      # Signs with its own key and subject, never the web key.
      VIHARBOT_MEMORY_URL: https://memory:8000
      VIHARBOT_MEMORY_CA_FILE: /run/viharbot-memory/tls/ca.pem
      VIHARBOT_OUTBOUND_AUTH: ${VIHARBOT_OUTBOUND_AUTH:-on}
      VIHARBOT_SIGNING_KID: charlie-dev-1
      VIHARBOT_SERVICE_SUBJECT: charlie
      VIHARBOT_SIGNING_KEY_FILE: /run/viharbot-memory/auth/charlie.key
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - ./data/dev-auth/memory-client:/run/viharbot-memory/auth:ro
      - ./data/dev-auth/tls/ca:/run/viharbot-memory/tls:ro
      - synthesis_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pixel:
    build:
      context: .
      dockerfile: Dockerfile.pixel
    environment:
      <<: *auth-verify
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      PIXEL_MODEL: ${PIXEL_MODEL:-openai/gpt-5.4-mini}
      # The service refuses to run unless this is true. Same switch as the web service.
      VIHARBOT_PPT_GENERATION_ENABLED: ${VIHARBOT_PPT_GENERATION_ENABLED:-true}
      # Budgets for one deck: slides planned and the hard cap on model calls.
      PIXEL_TARGET_SLIDES: ${PIXEL_TARGET_SLIDES:-6}
      PIXEL_MAX_MODEL_CALLS: ${PIXEL_MAX_MODEL_CALLS:-8}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - pixel_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sage:
    build:
      context: .
      dockerfile: Dockerfile.sage
    environment:
      <<: *auth-verify
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # Sage prefers a Claude Opus model, but the gateway routes no Claude alias, so this is a
      # verified existing alias (see docs/sage-service.md). Override it with SAGE_MODEL.
      SAGE_MODEL: ${SAGE_MODEL:-gpt-6.1-sol}
      SAGE_MODEL_TIMEOUT_SECONDS: ${SAGE_MODEL_TIMEOUT_SECONDS:-80}
      MEMORY_DIR: /data
    volumes:
      - ./data/dev-auth/registry.toml:/run/viharbot-auth/registry.toml:ro
      - sage_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Governed memory (ADR-009, issue #40). Part of the default local stack. Only Charlie (the
  # synthesis service) calls it. Database passwords are throwaway values generated by
  # `python scripts/dev_service_auth.py` into data/dev-auth/memory-db/ (gitignored); there are no
  # passwords in this file. If that command has not been run the files are absent, the passwords are
  # empty, and postgres, memory-migrate and memory refuse to start with a message that names it.
  # `required: false` keeps `docker compose config` working before setup. No agent holds a database
  # credential; only `memory` and `memory-migrate` do, each its own role (separate files).
  postgres:
    image: postgres:17.11-alpine3.24
    env_file:
      - path: ./data/dev-auth/memory-db/postgres.env
        required: false
    environment:
      MEMORY_DB_NAME: ${MEMORY_DB_NAME:-viharbot_memory}
    volumes:
      - memory_pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - agent-network
    healthcheck:
      # Over TCP on purpose: during first-run initialization the image runs a temporary server that
      # listens on the unix socket only, so a socket check reports healthy before the roles and the
      # database exist and memory-migrate then fails once. Only the final server listens on TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies the numbered SQL migrations as the migration role, then exits.
  memory-migrate:
    build:
      context: .
      dockerfile: Dockerfile.memory
    command: ["python", "-m", "viharbot.memory_service.migrate"]
    environment:
      MEMORY_MIGRATE_DB_HOST: postgres
      MEMORY_MIGRATE_DB_PORT: "5432"
      MEMORY_MIGRATE_DB_NAME: ${MEMORY_DB_NAME:-viharbot_memory}
      MEMORY_MIGRATE_DB_USER: memory_migrator
    env_file:
      - path: ./data/dev-auth/memory-db/migrate.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-network
    restart: "no"

  memory:
    build:
      context: .
      dockerfile: Dockerfile.memory
    environment:
      MEMORY_DB_HOST: postgres
      MEMORY_DB_PORT: "5432"
      MEMORY_DB_NAME: ${MEMORY_DB_NAME:-viharbot_memory}
      MEMORY_DB_USER: memory_service
      # Public keys only. The service has no unauthenticated mode and refuses to start without it.
      VIHARBOT_KEY_REGISTRY: /run/memory/key-registry.toml
      # HTTPS with the development certificate from scripts/dev_memory_tls.py (ADR-009 requires
      # TLS on every non-loopback connection). Development certificates only; see docs.
      MEMORY_TLS_CERT_FILE: /run/memory/tls/memory.pem
      MEMORY_TLS_KEY_FILE: /run/memory/tls/memory.key
    env_file:
      - path: ./data/dev-auth/memory-db/service.env
        required: false
    volumes:
      - ${MEMORY_KEY_REGISTRY_FILE:-./data/dev-auth/memory-registry.toml}:/run/memory/key-registry.toml:ro
      - ./data/dev-auth/tls/server:/run/memory/tls:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      memory-migrate:
        condition: service_completed_successfully
    networks:
      - agent-network
    healthcheck:
      # In-container loopback check of the HTTPS listener; the certificate is not verified here.
      test: ["CMD", "python", "-c", "import ssl; from urllib.request import urlopen; urlopen('https://127.0.0.1:8000/health', timeout=2, context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  orchestrator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      VIHARBOT_OUTBOUND_AUTH: ${VIHARBOT_OUTBOUND_AUTH:-on}
      VIHARBOT_SIGNING_KID: orchestrator-dev-1
      VIHARBOT_SERVICE_SUBJECT: orchestrator
      VIHARBOT_SIGNING_KEY_FILE: /run/viharbot-auth/signing.key
      RESEARCH_URL: http://research:8000/research
      SECURITY_URL: http://security:8000/assess
      FACT_CHECK_URL: http://fact-check:8000/process
      SOURCE_QUALITY_URL: http://source-quality:8000/process
      PRIVACY_REVIEW_URL: http://privacy-review:8000/process
      SYNTHESIS_URL: http://synthesis:8000/process
      RESEARCH_QUESTION: ${RESEARCH_QUESTION:-Summarize general safety practices for bicycle maintenance.}
    volumes:
      - ./data/dev-auth/keys/orchestrator.key:/run/viharbot-auth/signing.key:ro
    depends_on:
      research:
        condition: service_healthy
      security:
        condition: service_healthy
      fact-check:
        condition: service_healthy
      source-quality:
        condition: service_healthy
      privacy-review:
        condition: service_healthy
      synthesis:
        condition: service_healthy
    networks:
      - agent-network

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    # Offline and hermetic. Every value is a literal: nothing is interpolated from the shell or a
    # developer's .env, so no LiteLLM key, token or model alias can reach this container, and the
    # opt-in live checks cannot be switched on from here. The container has no network at run time
    # (loopback only, which the streaming tests use); images are built, with network, beforehand.
    # The opt-in live checks (billable) are run on the host with their variables set, not here.
    environment:
      MEMORY_DIR: /tmp/viharbot-test-memory
      RUN_LITELLM_INTEGRATION: "0"
      RUN_LITELLM_INFERENCE: "0"
    network_mode: none

networks:
  agent-network:
    name: viharbot-agent-network
    driver: bridge

volumes:
  fact_check_data:
  source_quality_data:
  privacy_review_data:
  synthesis_data:
  pixel_data:
  sage_data:
  memory_pg_data:
